name: Deploy GitHub Pages

# Builds the static export of the portfolio and deploys it to GitHub Pages.
# Works whether the repository's Pages source is "GitHub Actions" or the legacy
# branch build: it switches the source to Actions when permitted, cancels any
# in-flight legacy Jekyll build that could overwrite this deploy, and verifies
# the live site afterwards.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prefer Actions as the Pages source and quiet legacy builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow; then
            echo "Pages source switched to GitHub Actions."
          else
            echo "::warning::Could not switch the Pages source (needs Settings → Pages → Source: GitHub Actions). Continuing; the deploy is verified and retried below."
          fi
          ids=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
            --jq '.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed") | .id' || true)
          for id in $ids; do
            echo "Cancelling legacy Pages build run $id so it cannot overwrite this deploy."
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build static export
        run: npm run build:pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the live site serves the portfolio
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            sleep 15
            if curl -fsSL "$PAGE_URL" | grep -q 'hero-portrait-stage'; then
              echo "Live site serves the portfolio."
              exit 0
            fi
            echo "Live site is not the portfolio yet (attempt $i)..."
          done
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Legacy Jekyll build likely overwrote the deploy; re-dispatching this workflow once."
            gh workflow run "Deploy GitHub Pages" --repo "${{ github.repository }}" --ref "${{ github.ref }}"
          else
            echo "::error::Live site does not serve the portfolio and this run is already a retry."
          fi
          exit 1
